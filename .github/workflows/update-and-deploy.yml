name: Update literature and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Tuesday and Friday 09:00 Beijing time (UTC+8).
    - cron: '0 1 * * 2,5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect literature
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/update.py
      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- docs/data/articles.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/data/articles.json
            git commit -m 'Update literature index'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
