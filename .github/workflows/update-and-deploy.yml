name: Update literature and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_backfill:
        description: Recheck all eight years (true), or test the normal 60-day update (false)
        type: boolean
        default: false
  schedule:
    # Tuesday and Friday 09:00 Beijing time (UTC+8).
    - cron: '0 1 * * 2,5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect literature
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backfill == true && '1' || '0' }}
        run: python3 scripts/update.py
      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add -A docs/data
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update literature index'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Include review decisions in site
        run: cp reviews.json docs/data/reviews.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
