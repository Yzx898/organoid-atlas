name: Translate literature drafts

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of articles to translate in this test run
        required: false
        default: '3'
  schedule:
    # Daily at 10:17 Beijing time, after the literature search on Tuesdays and Fridays.
    - cron: '17 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline translation model runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' sentencepiece sacremoses
      - name: Translate a bounded batch
        env:
          MAX_TRANSLATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '80' }}
          MAX_SECONDS: '2700'
        run: python scripts/translate.py
      - name: Commit translations
        run: |
          git add docs/data/translations.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add Chinese translation drafts'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Include review decisions in site
        run: cp reviews.json docs/data/reviews.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
