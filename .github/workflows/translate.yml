name: Translate literature drafts

on:
  workflow_dispatch:
  schedule:
    # Daily at 10:17 Beijing time, after the literature search on Tuesdays and Fridays.
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: literature-data
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline translation model runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' sentencepiece sacremoses
      - name: Translate a bounded batch
        env:
          MAX_TRANSLATIONS: '80'
          MAX_SECONDS: '2700'
        run: python scripts/translate.py
      - name: Commit translations
        run: |
          if ! git diff --quiet -- docs/data/translations.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/data/translations.json
            git commit -m 'Add Chinese translation drafts'
            git pull --rebase origin main
            git push
          fi
