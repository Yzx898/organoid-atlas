name: Repack literature by year

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: literature-data
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Split existing literature and remove obsolete entries
        env:
          REPACK_ONLY: '1'
        run: python scripts/update.py
      - name: Commit annual files
        run: |
          git add -A docs/data
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Split literature index by publication year'
            git pull --rebase origin main
            git push
          fi
